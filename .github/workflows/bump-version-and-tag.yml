name: Bump Version And Tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "New version (SemVer, e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  bump-and-tag:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Validate input and branch
        env:
          VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$REF_NAME" != "master" ]; then
            echo "This workflow must be run from master. Current ref: $REF_NAME" >&2
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version: $VERSION. Expected SemVer format like 0.2.0" >&2
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "Tag v$VERSION already exists." >&2
            exit 1
          fi

      - name: Update project version
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          sed -i -E "s#<Version>[^<]+</Version>#<Version>${VERSION}</Version>#" BopVisualEffects/BopVisualEffects.csproj

      - name: Commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add BopVisualEffects/BopVisualEffects.csproj

          if git diff --cached --quiet; then
            echo "No version change detected." >&2
            exit 1
          fi

          git commit -m "chore: bump version to v${VERSION}"
          git tag "v${VERSION}"
          git push origin master
          git push origin "v${VERSION}"
