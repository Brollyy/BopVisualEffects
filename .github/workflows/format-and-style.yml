name: Format And Code Style

on:
  pull_request:
    branches: ["master"]
  merge_group:

jobs:
  whitespace-format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore BopVisualEffects.sln

      - name: Verify whitespace formatting
        run: dotnet format whitespace BopVisualEffects.sln --verify-no-changes --verbosity minimal --exclude BopVisualEffects/obj

  code-style:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore BopVisualEffects.sln

      - name: Verify code style rules
        run: dotnet format style BopVisualEffects.sln --verify-no-changes --verbosity minimal --exclude BopVisualEffects/obj

  analyzers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore BopVisualEffects.sln

      - name: Verify analyzer rules
        run: dotnet format analyzers BopVisualEffects.sln --verify-no-changes --verbosity minimal --exclude BopVisualEffects/obj
